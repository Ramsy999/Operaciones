<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Aprediendo JS</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <h1>Operaciones en JS</h1>
        <script>
            let n1= Number(prompt("Introduce un numero"));
            let n2=Number(prompt("introduce otro numero"));
            suma=n1+n2;
            resta=n1-n2;
            multi=n1*n2;
            divi=n1/n2;
            poten=n1**n2;
            resi=n1%n2;
            document.write("La suma de "+n1+"+"+n2+" es :"+suma+"<br>");
            document.write("La resta de "+n1+"-"+n2+" es :"+resta+"<br>");
            document.write("La multiplicación de "+n1+"x"+n2+" es :"+multi+"<br>");
            document.write("La división de "+n1+"/"+n2+" es :"+divi+"<br>");
            document.write("La potencia de "+n1+"^"+n2+" es :"+poten+"<br>");
            document.write("El residuo de la división de "+n1+"%"+n2+" es :"+resi);
        </script>
    </body>
</html>
